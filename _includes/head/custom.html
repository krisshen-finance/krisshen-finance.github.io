{% include base_path %}

<!-- start custom head snippets -->

<!-- Typography: Source Serif 4 (headings) + Inter (text) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/KleinBottle.png"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/KleinBottle.png"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/KleinBottle.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/KleinBottle.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/KleinBottle.png"/>
<meta name="theme-color" content="#ffffff"/>

<!-- Light theme only. main.min.js would otherwise switch to dark mode from a
     saved choice or the visitor's system setting, so pin the saved choice to
     light before it runs and strip any dark flag that still gets set. -->
<meta name="color-scheme" content="light"/>
<script>
  (function () {
    try { localStorage.setItem("theme", "light"); } catch (e) {}
    var root = document.documentElement;
    root.removeAttribute("data-theme");
    new MutationObserver(function () {
      if (root.getAttribute("data-theme") === "dark") root.removeAttribute("data-theme");
    }).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  })();
</script>

<!-- end custom head snippets -->
