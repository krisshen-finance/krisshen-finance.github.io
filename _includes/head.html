{% include base_path %}

<meta charset="utf-8">
<meta name="author" content="{{ site.name }}">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

{% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
<link rel="stylesheet" href="{{ base_path }}/assets/css/custom.css">

<meta http-equiv="cleartype" content="on">

{% if page.permalink == "/" %}
<!-- Schema.org Person markup for homepage -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Kris Shen",
  "alternateName": "Kris Shen Finance",
  "url": "{{ site.url }}",
  {% capture sameas_raw %}{% if site.author.googlescholar %}{{ site.author.googlescholar }},{% endif %}{% if site.author.institution_profile %}{{ site.author.institution_profile }},{% endif %}{% endcapture %}
  "sameAs": {{ sameas_raw | split: "," | jsonify }},
  "jobTitle": "PhD Candidate in Finance",
  "worksFor": {
    "@type": "CollegeOrUniversity",
    "name": "The Ohio State University",
    "department": {
      "@type": "Organization",
      "name": "Fisher College of Business"
    },
    "url": "https://fisher.osu.edu/"
  },
  "affiliation": {
    "@type": "CollegeOrUniversity",
    "name": "The Ohio State University, Fisher College of Business"
  },
  "knowsAbout": ["Asset Pricing", "Finance", "Technology and Innovation", "Private Markets", "Public Markets"],
  "alumniOf": [
    {
      "@type": "CollegeOrUniversity",
      "name": "Cornell University"
    },
    {
      "@type": "CollegeOrUniversity",
      "name": "Wuhan University"
    }
  ],
  "email": "shen.1732@osu.edu",
  "image": "{{ site.url }}/images/profile.png",
  "description": "PhD candidate in Finance at The Ohio State University, Fisher College of Business"
}
</script>
<!-- WebSite structured data to reinforce site name -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Kris Shen",
  "alternateName": "Kris Shen - Finance PhD",
  "url": "{{ site.url }}",
  "author": {
    "@type": "Person",
    "name": "Kris Shen"
  },
  "publisher": {
    "@type": "Person",
    "name": "Kris Shen"
  },
  "inLanguage": "en-US"
}
</script>
{% endif %}
